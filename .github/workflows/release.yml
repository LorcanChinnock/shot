name: Release

# release-please keeps a release PR open that bumps the version and changelog from
# Conventional Commits on main. Merging that PR tags the release, and the build job
# then attaches Shot-vX.Y.Z.zip and the Sparkle update feed (appcast.xml) to it once the tests and the build pass.
# Installed copies read the feed from releases/latest/download/appcast.xml, so the release stays a
# draft (tag created up front) until its assets are attached; otherwise `latest` has no feed mid-build.
# release-please acts as the repository's GitHub App, not GITHUB_TOKEN: GitHub holds the workflows on a pull request
# from github-actions[bot] until someone approves them. The release PR's CI runs the macOS release gate (ci.yml), and an
# admin merges it by hand. The repository has auto-merge turned off.
on:
  push:
    branches: [main]

# Each job asks for what it needs; the build job has the signing secrets, so it only reads the release, and the publish job holds the upload rights.
permissions:
  contents: read

# Two quick merges to main would otherwise run release-please, and maybe two builds, at once. A run that's waiting is
# replaced by a newer one, which is fine: release-please reads main as it is, and tags any merged release PR it finds
# untagged.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-please writes with the app's token, so GITHUB_TOKEN needs nothing.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # See CONTRIBUTING.md › Release secrets. The token lasts only for this job.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs beside `build` and gates `publish`, so the tests cost no wall-clock time unless they're the slower of the two.
  # The release PR's gate tested its own head, but a docs:, test: or ci: commit merged after it doesn't update that
  # PR, so the tagged commit may be one the gate never ran. Holds no secrets, and uses the same Package.resolved that
  # `make dist` builds against.
  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # macOS: ShotCore's tests need Core Graphics, Core Image, AVFoundation and Vision.
    runs-on: macos-26
    # A hung test would otherwise hold this runner, and the `release` concurrency group that every later push to main
    # waits on, for GitHub's 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Test
        timeout-minutes: 15
        run: scripts/ci-test.sh test --force-resolved-versions
      # A test process that crashes leaves only its signal in the log; the report has the stack. See scripts/crash-reports.sh.
      - name: Keep the crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-reports
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
          retention-days: 7

  # Builds and signs the zip and the update feed, and hands them to `publish`, which waits for `test`.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # macOS: builds and signs the app, on the same image as CI's macos check so the SDK is the one the gate tested.
    runs-on: macos-26
    # A build takes about 10 minutes.
    timeout-minutes: 30
    # The `release` environment holds the release secrets and only deploys from main and v* tags. See CONTRIBUTING.md › Release secrets.
    environment: release
    # A draft release's notes need write access to read, though this job only reads them.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # The build number counts commits.
          persist-credentials: false # Later steps run scripts with every secret, and none of them pushes to this repo.
      # Every release signs with the same self-signed certificate, so macOS keeps the
      # Screen Recording permission across updates. See CONTRIBUTING.md › Release secrets.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.SHOT_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SHOT_SIGNING_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build Shot.zip
        run: make dist
        env:
          SHOT_SIGN_IDENTITY: Shot Release
      - name: Build the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir build/release
          mv build/Shot.zip "build/release/Shot-${TAG}.zip"
          gh release view "$TAG" --json body --jq .body > "build/release/Shot-${TAG}.md"
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${TAG}/" \
            --embed-release-notes \
            --link "https://github.com/${{ github.repository }}" \
            build/release
      # For direct downloads: Sparkle's EdDSA check only covers updates. install.sh checks the zip against this file.
      - name: Checksum the zip
        working-directory: build/release
        run: shasum -a 256 "Shot-${TAG}.zip" > SHA256SUMS
      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/release
          compression-level: 0
          retention-days: 1

  # Only after the tests pass does anything reach the release, so a failing test leaves a draft nobody can download.
  publish:
    needs: [release-please, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    # Uploads and publishes the release's assets with GITHUB_TOKEN; the first two sign the build provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build/release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/Shot-${{ env.TAG }}.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/release/Shot-${TAG}.zip" build/release/appcast.xml build/release/SHA256SUMS --clobber
      # Tags are -beta.N, but the release is published as stable and latest, because installed copies read the
      # update feed from releases/latest/download/appcast.xml and `latest` never points at a prerelease.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest --prerelease=false
