name: Release PR

# The release PR doesn't merge itself: an admin merges it by hand once CI's macOS gate has set its `test` status
# (release.yml runs the gate). GitHub allows auto-merge for the whole repository or not at all, so this turns it off
# again whenever someone enables it on the release PR.
# Only auto_merge_enabled, not every push, so other pull requests don't list this as a skipped check.
on:
  pull_request:
    types: [auto_merge_enabled]

permissions:
  contents: read

jobs:
  no-auto-merge:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Turn auto-merge off
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
