name: Warm cache

# Builds what ci.yml's pull request check builds and saves it, so that check starts from main's latest build. A pull
# request can restore caches saved on main, not other pull requests', so the save has to happen here. Its own workflow,
# so pull requests don't list it as a skipped check. Keep the image and the key in step with ci.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.3-linux-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-6.3-linux-${{ hashFiles('Package.resolved') }}-
      # ShotCoreLinux links libpng, libjpeg-turbo, Cairo, Pango, xcb and libdbus. Nothing runs here, so it needs no Xvfb or bus.
      - name: Install packages
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libpng-dev libturbojpeg0-dev libcairo2-dev libpango1.0-dev libxcb1-dev libxcb-composite0-dev libxcb-randr0-dev libdbus-1-dev fonts-dejavu-core
      - name: Build
        run: swift build --build-tests --force-resolved-versions
      - name: Save the build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.3-linux-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
