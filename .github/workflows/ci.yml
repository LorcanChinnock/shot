name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: make test
      # Compiles the x86_64 slice too, so Intel build breaks show up here.
      - name: Build universal bundle
        run: make dist
        env:
          SHOT_SIGN_IDENTITY: "-"

  # Runs the tests natively on Intel. The Intel runner is several times slower,
  # so this runs after merge rather than on every pull request.
  test-intel:
    if: github.event_name == 'push'
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: make test
