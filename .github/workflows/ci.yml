name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        xcode: ['27.0', '27.0b', '27.1', '27.1b']
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ startsWith(matrix.xcode, '27.0') && '27.0' || '27.1' }}.app/Contents/Developer
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Info
        run: |
          echo "image $ImageOS $ImageVersion"; sw_vers; xcodebuild -version; sysctl -n hw.ncpu hw.memsize
      - name: Build
        run: swift build --build-tests --force-resolved-versions
      - name: Loop
        run: .github/probe/loop.sh 10
      - name: Crash reports
        if: always()
        run: |
          ls ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports 2>/dev/null
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do [ -f "$f" ] && python3 -I .github/probe/ips.py "$f"; done; true
