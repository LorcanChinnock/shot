name: CI

# Every pull request runs `macos`, which lints, builds the app and runs every test, so a break can't reach main. On
# release-please's PR it also runs the performance budgets: that's the release gate. release-please opens that PR as
# the repository's GitHub App (release.yml), so its runs start without approval.
# There's no run on push to main: PRs are squash-merged, and their merge commit was already tested.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check, so main's ruleset needs it by name. The repository is public, so macOS minutes are free; the
  # cost is queue time, since the free plan runs 5 macOS jobs at once.
  macos:
    # macOS: Shot is a Mac app, and its tests need AppKit, AVFoundation, CoreImage and ImageIO.
    runs-on: macos-26
    # A run takes about 5 minutes. A hung test would otherwise hold a macOS runner for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What `make lint` runs before its build, which the next step does.
      - name: Lint
        run: scripts/lint.sh
      - name: Build
        run: swift build --build-tests --force-resolved-versions
      # Every build extracts the app's strings, so this needs the build above. See scripts/strings.sh.
      - name: Check strings
        run: scripts/strings.sh --check
      # `make dist` builds a universal app, so the release must compile for Intel too. Compile only; nothing runs it.
      - name: Build for Intel
        run: swift build --arch x86_64 --force-resolved-versions
      - name: Test on macOS
        run: make test ARGS=--skip-build
      # Only at the release gate, to keep ordinary PRs' runs short. Alone, so other tests running in parallel don't skew
      # the timings. Budgets: docs/performance.md.
      - name: Perf
        if: startsWith(github.head_ref, 'release-please--')
        run: make perf ARGS=--skip-build
