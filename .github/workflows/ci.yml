name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: make test
      - name: Bundle
        run: make bundle
        env:
          SHOT_SIGN_IDENTITY: "-"
