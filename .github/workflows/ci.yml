name: CI

# Every pull request runs two required jobs. `linux` lints, including the website's rules. `macos` builds the app and
# runs every test, so a break can't reach main. release-please opens its PR as the repository's GitHub App
# (release.yml), so its runs start without approval.
# There's no run on push to main: PRs are squash-merged, and their merge commit was already tested.
# A pull request that changes only the website, the docs or Markdown skips `macos`, which counts as a pass for the
# required check, so those PRs don't queue for a macOS runner. `changes` decides that, and if it fails for any reason,
# `macos` runs after all. Release-please's PR always runs it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the app needs testing at all. It takes seconds. `macos` runs when this job fails or times out, so a
  # problem here can't skip the app's checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_HEAD_REF" == release-please--* ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside site/, docs/ and top-level Markdown files can change the app or its build.
          # Read into a variable first, so a failed call fails this step (and `macos` runs) instead of reading no files.
          # A renamed file lists its old path too, so moving a file out of the app counts as an app change.
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
          app=false
          while IFS= read -r file; do
            if ! [[ "$file" =~ ^(site/|docs/|[^/]+\.md$) ]]; then app=true; fi
          done <<< "$files"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  # A required check, so main's ruleset needs it by name. It always runs, so a PR that skips `macos` still gets its
  # rules checked (the website's among them). Warble's version also runs its Linux-portable tests; Shot has none.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: scripts/lint.sh

  # A required check too. The repository is public, so macOS minutes are free; the cost is queue time, since the free
  # plan runs 5 macOS jobs at once.
  macos:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    # macOS: builds the app and runs ShotCore's tests, which need Core Graphics, Core Image, AVFoundation and Vision.
    runs-on: macos-26
    # A run takes about 5 minutes. A hung test would otherwise hold a macOS runner for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Apart from the build, so a run shows how long fetching dependencies takes next to compiling.
      - name: Resolve packages
        run: swift package resolve --force-resolved-versions
      - name: Build
        run: swift build --build-tests --force-resolved-versions
      # Every build extracts the app's strings, so this needs the build above. See scripts/strings.sh.
      - name: Check strings
        run: scripts/strings.sh --check
      # `make dist` builds a universal app, so the release must compile for Intel too. Compile only; nothing runs it.
      - name: Build for Intel
        run: swift build --arch x86_64 --force-resolved-versions
      # The tests take about 90 seconds. A hang would otherwise hold the runner for the rest of the job's 20 minutes.
      - name: Test on macOS
        timeout-minutes: 10
        run: scripts/ci-test.sh test --skip-build
      # Starts the app, which no other step does, so a bad entitlement, a missing resource or a Sparkle misconfiguration
      # fails here and not after release. Builds the universal release app, as `make dist` does. See scripts/smoke.sh.
      - name: Launch smoke test
        timeout-minutes: 10
        run: make bundle && scripts/smoke.sh
      # CI builds debug, but `make dist` builds the release configuration (scripts/bundle.sh) after the release is tagged.
      # Build it here so a release-only compile error fails the gate, not the release. One slice: the debug Intel compile
      # covers the other.
      - name: Build the release configuration
        if: startsWith(github.head_ref, 'release-please--')
        run: swift build -c release --arch arm64 --force-resolved-versions
      # A test process that crashes leaves only its signal in the log; the report has the stack. See scripts/crash-reports.sh.
      - name: Keep the crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-reports
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
          retention-days: 7
