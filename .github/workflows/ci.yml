name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [full, media]
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Info
        run: |
          echo "image $ImageOS $ImageVersion"; sw_vers; xcodebuild -version; sysctl -n hw.ncpu
      - name: Build
        run: swift build --build-tests --force-resolved-versions
      - name: Loop
        run: |
          set +e
          fails=0
          for i in $(seq 1 12); do
            if [ "${{ matrix.mode }}" = media ]; then
              swift test --skip-build --filter 'MediaTests|CompositingMediaTests' > run.log 2>&1 &
            else
              make test ARGS=--skip-build > run.log 2>&1 &
            fi
            pid=$!
            for s in $(seq 1 600); do
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            if kill -0 $pid 2>/dev/null; then
              echo "iteration $i HUNG"
              for h in $(pgrep -f swiftpm-testing-helper; pgrep -f ShotCorePackageTests); do sample $h 5 -file sample-$h.txt; cat sample-$h.txt | head -400; done
              pkill -9 -f swiftpm-testing-helper; kill -9 $pid
              fails=$((fails+1)); continue
            fi
            wait $pid; rc=$?
            echo "iteration $i exit $rc"
            if [ $rc -ne 0 ]; then
              fails=$((fails+1))
              grep -E "signal|✘|started\.$" run.log | tail -30
            fi
          done
          echo "FAILS $fails"
      - name: Crash reports
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports || true
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -newer Package.swift 2>/dev/null | grep -v -i -E "jetsam|ExcUserFault" > ips.txt || true
          cat ips.txt
          [ -s ips.txt ] && python3 .github/probe/ips.py $(cat ips.txt) || echo none
