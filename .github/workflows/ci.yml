name: CI

on:
  pull_request:
  # release.yml dispatches this on release-please's PR branch, whose pushes come from
  # GITHUB_TOKEN and so never trigger pull_request runs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # Restores the newest cache for the same dependencies, so builds are incremental.
      - uses: actions/cache@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
      - name: Test
        run: make test
      # Compiles the x86_64 slice, so Intel build breaks show up here. Releases build and sign the real bundle in release.yml.
      - name: Build x86_64
        run: swift build --arch x86_64
