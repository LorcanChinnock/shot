name: Bug report
description: Something in Shot doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shot version
      description: Settings › About, or the release you downloaded.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro M3, one external display
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Reproduce the problem, then run this in Terminal and paste the output.
        File paths are redacted by default.
        `log show --last 5m --predicate 'subsystem == "dev.lorcan.Shot"'`
      render: text
